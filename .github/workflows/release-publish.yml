name: Release & Build Images
on:
  pull_request:
    types:
      - closed
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore(master): release')
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release_please.outputs.releases_created }}
      tag_name: ${{ steps.release_please.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release_please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
  build:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: api
          - package: web
          - package: patroni
            pg: 17
          - package: patroni
            pg: 16
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata Docker
        if: matrix.package != 'patroni'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.package }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag_name }}
            type=raw,value=latest
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Compute release tag base
        id: tagbase
        # Tourne sur toutes les jobs matrix (pas seulement patroni) : la sortie
        # `base` est consommée à la fois par le build api/web (env HULLBAY_RELEASE)
        # et par le build patroni (tag <release>-pg<major>).
        run: |
          BASE="${TAG_NAME#v}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
      - name: Build & Push api/web
        if: matrix.package != 'patroni'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.package }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Injecte la release courante (sans le `v`) dans l'argument de build de l'API :
          # même valeur `base` qui tague patroni:<release>-pgXX, une seule source
          # de vérité (le tag release-please) — l'API cible l'image de SA release.
          build-args: |
            HULLBAY_RELEASE=${{ steps.tagbase.outputs.base }}
      - name: Build & Push patroni
        if: matrix.package == 'patroni'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/patroni/Dockerfile
          push: true
          build-args: PG_VERSION=${{ matrix.pg }}
          # Tag ALIGNÉ sur la release hullbay + major PG, ex `1.2.4-pg17` (sans le
          # `v` du git tag) — même `base` que celle injectée dans l'API via
          # HULLBAY_RELEASE, une seule source de vérité. Pas de latest : fixe par release.
          tags: ghcr.io/${{ github.repository }}/patroni:${{ steps.tagbase.outputs.base }}-pg${{ matrix.pg }}
