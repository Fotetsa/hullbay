name: Release & Build Images
on:
  pull_request:
    types:
      - closed
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore(master): release')
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release_please.outputs.releases_created }}
      tag_name: ${{ steps.release_please.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release_please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
  build:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: api
          - package: web
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.package }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag_name }}
            type=raw,value=latest
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Read Patroni version from Dockerfile
        id: patroni-pin
        run: |
          VERSION="$(grep -oP 'ARG PATRONI_VERSION=\K[0-9.]+' packages/patroni/Dockerfile)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build & Push api/web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.package }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Injecte la version de Patroni courante (pin du Dockerfile) dans l'API :
          # c'est la valeur qui tague patroni:v<version>-pgXX (workflow dédié) —
          # une seule source de vérité = le pin du Dockerfile Patroni.
          build-args: |
            PATRONI_VERSION=${{ steps.patroni-pin.outputs.version }}
