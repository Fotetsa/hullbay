name: Build & Push Beta Images

on:
  pull_request:
    types:
      - closed
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [api, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh release list \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$VERSION" ]; then
            echo "No stable release found."
            exit 1
          fi

          VERSION="${VERSION#v}"

          echo "BASE_VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get next beta version
        id: beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ steps.release.outputs.BASE_VERSION }}"

          LAST=$(gh api \
            --paginate \
            "/user/packages/container/${{ github.event.repository.name }}-${{ matrix.package }}/versions" \
            --jq '.[].metadata.container.tags[]?' 2>/dev/null \
            | grep -E "^${BASE}-beta\.[0-9]+$" \
            | sed "s/^${BASE}-beta\.//" \
            | sort -n \
            | tail -1 || true)

          if [ -z "$LAST" ]; then
            NEXT=1
          else
            NEXT=$((LAST + 1))
          fi

          VERSION="${BASE}-beta.${NEXT}"

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Building beta: $VERSION"

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.package }}
          tags: |
            type=raw,value=${{ steps.beta.outputs.VERSION }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/${{ matrix.package }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
